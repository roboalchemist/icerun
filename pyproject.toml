[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icerun"
version = "0.1.0"
description = "Firecrawl-compatible web scraper — proxy rotation + local parsers"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7",
    "typer[all]>=0.12",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    "html2text>=2020.1",
    "markdownify>=0.11",
    "selectolax>=0.3",
    "tenacity>=8.0",
]

[project.optional-dependencies]
browser = ["camoufox[geoip]>=0.4"]
extract = ["instructor>=1.0"]
pdf = ["pdfplumber>=0.11"]
all = ["icerun[browser,extract,pdf]"]

[project.scripts]
icerun = "icerun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["icerun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]
